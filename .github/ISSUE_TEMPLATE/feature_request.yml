name: Feature request
description: Suggest an idea for Enzopad
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do at the table?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: input
    id: game
    attributes:
      label: Which game is it for?
